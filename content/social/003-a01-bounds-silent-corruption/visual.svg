<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="t d">
<title id="t">A GPU kernel can print PASSED while 24 threads write past the array</title>
<desc id="d">Four panels. Panel 1: PASSED on a CPU check of N equals 1000. Panel 2: four blocks times 256 threads equals 1024, with 24 out of bounds. Panel 3: the one-line guard if (idx &lt; n) makes those 24 skip. Panel 4: would you ship the unguarded kernel? Tests never see index N+1. Footer: Parallel Spectrum Track A A01.</desc>

<!--
  brief:
    id: social-003-bounds-guard
    module: A01
    track: A
    visual_job: sequence
    numbers: derived - ceil(1000/256)=4 blocks, 1024 threads, 24 with idx &gt;= n
    static_fallback: all four panels are drawn; nothing depends on motion
-->

<style>
  .ground { fill: #0F172A; }
  .rule   { fill: #0891B2; }
  .card   { fill: #172033; }
  .numc   { fill: #0891B2; }
  .numt   { fill: #F8FAFC; font: 700 18px Inter, "Segoe UI", system-ui, sans-serif; }
  .kicker { fill: #0891B2; font: 700 12px Inter, "Segoe UI", system-ui, sans-serif; letter-spacing: 2.2px; }
  .title  { fill: #F8FAFC; font: 700 28px Inter, "Segoe UI", system-ui, sans-serif; }
  .sub    { fill: #94A3B8; font: 400 16px Inter, "Segoe UI", system-ui, sans-serif; }
  .big    { fill: #10B981; font: 700 56px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .amber  { fill: #F59E0B; font: 700 36px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .mono   { fill: #F8FAFC; font: 700 22px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .code   { fill: #0891B2; font: 700 28px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .ok     { fill: #10B981; font: 700 18px Inter, "Segoe UI", system-ui, sans-serif; }
  .q      { fill: #F8FAFC; font: 700 26px Inter, "Segoe UI", system-ui, sans-serif; }
  .hint   { fill: #64748B; font: 400 16px Inter, "Segoe UI", system-ui, sans-serif; }
  .foot   { fill: #64748B; font: 400 14px Inter, "Segoe UI", system-ui, sans-serif; }
  .lbl    { fill: #CBD5E1; font: 400 14px Inter, "Segoe UI", system-ui, sans-serif; }
  .tiny   { fill: #94A3B8; font: 400 12px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .work   { fill: #0891B2; }
  .oob    { fill: #F59E0B; }
  .idle   { fill: #334155; }
</style>

<rect class="ground" width="1024" height="1024"/>
<rect class="rule" width="1024" height="4"/>

<!-- 1 Looks right -->
<rect class="card" x="40" y="24" width="944" height="216" rx="8"/>
<circle class="numc" cx="84" cy="64" r="18"/>
<text class="numt" x="84" y="70" text-anchor="middle">1</text>
<text class="kicker" x="118" y="70">LOOKS RIGHT</text>
<text class="big" x="118" y="148">PASSED</text>
<text class="sub" x="118" y="188">CPU checked N = 1000 elements</text>
<text class="tiny" x="720" y="70">vector_add  block=256</text>

<!-- 2 The extra 24 -->
<rect class="card" x="40" y="256" width="944" height="216" rx="8"/>
<circle class="numc" cx="84" cy="296" r="18"/>
<text class="numt" x="84" y="302" text-anchor="middle">2</text>
<text class="kicker" x="118" y="302">THE EXTRA 24</text>
<text class="mono" x="118" y="348">4 blocks &#215; 256 = 1024 threads</text>
<text class="amber" x="118" y="398">24 out of bounds</text>
<!-- last-block schematic: 232 work + 24 extra, drawn as two bars -->
<rect class="work" x="118" y="418" width="696" height="28" rx="4"/>
<rect class="oob"  x="814" y="418" width="72"  height="28" rx="4"/>
<text class="tiny" x="130" y="437" fill="#F8FAFC">last block: 232 work</text>
<text class="tiny" x="822" y="437" fill="#0F172A">24</text>
<text class="lbl"  x="900" y="438">OOB</text>

<!-- 3 One line -->
<rect class="card" x="40" y="488" width="944" height="216" rx="8"/>
<circle class="numc" cx="84" cy="528" r="18"/>
<text class="numt" x="84" y="534" text-anchor="middle">3</text>
<text class="kicker" x="118" y="534">ONE LINE</text>
<text class="code" x="118" y="590">if (idx &lt; n)</text>
<text class="ok" x="118" y="640">24 threads skip  &#183;  array stays yours</text>
<rect class="work" x="118" y="660" width="696" height="20" rx="3"/>
<rect class="idle" x="814" y="660" width="72"  height="20" rx="3"/>
<text class="tiny" x="822" y="675" fill="#94A3B8">skip</text>

<!-- 4 Assess -->
<rect class="card" x="40" y="720" width="944" height="216" rx="8"/>
<circle class="numc" cx="84" cy="760" r="18"/>
<text class="numt" x="84" y="766" text-anchor="middle">4</text>
<text class="kicker" x="118" y="766">ASSESS</text>
<text class="q" x="118" y="824">Would you ship the unguarded kernel?</text>
<text class="hint" x="118" y="868">Tests never see index N+1</text>
<text class="sub" x="118" y="900">The CPU reference compared N floats. The damage is past N.</text>

<text class="foot" x="512" y="990" text-anchor="middle">Parallel Spectrum &#183; Track A &#183; A01</text>
</svg>
