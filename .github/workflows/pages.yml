name: Deploy docs to GitHub Pages

# Build the MkDocs Material site and publish it to GitHub Pages.
# Runs on pushes to main; also available on-demand via the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "docs/stylesheets/**"
      - "docs/javascripts/**"
      # live/ holds the standalone planner and slide deck; assets/ holds the
      # infographics. Without these globs a change to any of them would never reach
      # Pages, since none of them is Markdown.
      - "live/**"
      - "assets/**"
      - "**/*.html"
      - "**/*.svg"
      - "**/*.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: read the repo, write Pages + OIDC token for deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs toolchain
        run: pip install -r requirements-docs.txt

      # enablement: true turns Pages on (build_type=workflow) if it is not already.
      # Without it this step fails with "Get Pages site failed ... Not Found" on any
      # repo where nobody has flipped the setting by hand in Settings > Pages, which
      # is what broke every run before this one - the job died here in ~20s and never
      # reached the build.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The curriculum's Markdown lives at the repo root, which MkDocs will not accept
      # as a docs_dir, so stage the publishable files first. See build_docs.py.
      - name: Stage docs root
        run: python build_docs.py

      # --strict is on deliberately: the build is warning-free, and the
      # validation: block in mkdocs.yml already silences the one category we do not
      # care about (links to intentionally-unpublished source files). Anything else
      # — a nav entry pointing at a deleted page, a bad theme option — should fail
      # the deploy loudly rather than ship a site with silent 404s.
      - name: Build site
        run: mkdocs build --clean --strict --site-dir ./site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
