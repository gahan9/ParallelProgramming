<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
<title id="t">The 30 modules across four tracks</title>
<desc id="d">Four rows of module chips. Track A, GPU programming, has ten modules from foundations through to CuTe. Track B, ML performance, has seven from accelerator architecture through to distributed sharding. Track C, ML system design, has seven from problem framing through to capstone case studies. Track D, distributed and cluster computing, has six from scaling limits through message passing, GPU collectives, interconnects and topology to real systems at scale. Curved lines show the four cross-track dependencies: A01 feeds B01, A07 feeds B05, B06 feeds C04, and B01 feeds D01.</desc>

<!--
  Orientation map for the whole curriculum. Row LENGTH encodes module count, so Track A
  being visibly longer is information rather than layout. Chip pitch is 81px
  (68 wide + 13 gap); to add a module, extend the row and update the count at its end.
  Row pitch is 130px; to add a track, extend the viewBox by 130 and move the footer.

  Deliberately not a dependency graph - CURRICULUM.md has the full Mermaid DAG. This
  answers a different question: "how much is there, and where am I?"
-->

<style>
  .ground  { fill: #0F172A; }
  .rule    { fill: #0891B2; }
  .eyebrow { fill: #0891B2; font: 700 12.5px Inter, "Segoe UI", system-ui, sans-serif; letter-spacing: 3.2px; }
  .head    { fill: #F8FAFC; font: 700 30px Inter, "Segoe UI", system-ui, sans-serif; letter-spacing: -.7px; }
  .sub     { fill: #94A3B8; font: 400 15px Inter, "Segoe UI", system-ui, sans-serif; }
  .chip    { rx: 4; }
  .cid     { font: 700 13px "JetBrains Mono", Consolas, ui-monospace, monospace; text-anchor: middle; }
  .tname   { font: 700 15px Inter, "Segoe UI", system-ui, sans-serif; }
  .tmeta   { fill: #64748B; font: 400 11.5px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .arc     { fill: #94A3B8; font: 400 12.5px Inter, "Segoe UI", system-ui, sans-serif; }
  .dep     { stroke: #475569; stroke-width: 1.3; fill: none; stroke-dasharray: 3 3; }
  .deplbl  { fill: #64748B; font: 400 10.5px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .tiny    { fill: #64748B; font: 400 11.5px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .start   { fill: #10B981; font: 700 10px "JetBrains Mono", Consolas, ui-monospace, monospace; }

  .beacon { animation: b 2.6s ease-in-out infinite; }
  @keyframes b { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .beacon { animation: none; opacity: .8 } }
</style>

<rect class="ground" width="1200" height="660"/>
<rect class="rule" width="1200" height="4"/>

<text class="eyebrow" x="56" y="52">30 MODULES &#183; ~203 HOURS &#183; ALL AUTHORED</text>
<text class="head"    x="54" y="92">Four tracks, one arc</text>
<text class="sub"     x="56" y="118">Write kernels, reason about speed, ship systems, then scale past one node. Start at A01 and branch when you know why.</text>

