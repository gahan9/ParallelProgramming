  <rect x="352" y="442" width="5" height="12" rx="1"/><rect x="361" y="442" width="5" height="12" rx="1"/>
  <rect x="370" y="442" width="5" height="12" rx="1"/><rect x="379" y="442" width="5" height="12" rx="1"/>
  <rect x="388" y="442" width="5" height="12" rx="1"/><rect x="397" y="442" width="5" height="12" rx="1"/>
  <rect x="406" y="442" width="5" height="12" rx="1"/><rect x="415" y="442" width="5" height="12" rx="1"/>
  <rect x="424" y="442" width="5" height="12" rx="1"/><rect x="433" y="442" width="5" height="12" rx="1"/>
  <rect x="442" y="442" width="5" height="12" rx="1"/><rect x="451" y="442" width="5" height="12" rx="1"/>
  <rect x="460" y="442" width="5" height="12" rx="1"/><rect x="469" y="442" width="5" height="12" rx="1"/>
  <rect x="478" y="442" width="5" height="12" rx="1"/><rect x="487" y="442" width="5" height="12" rx="1"/>
  <rect x="496" y="442" width="5" height="12" rx="1"/><rect x="505" y="442" width="5" height="12" rx="1"/>
  <rect x="514" y="442" width="5" height="12" rx="1"/><rect x="523" y="442" width="5" height="12" rx="1"/>
  <rect x="532" y="442" width="5" height="12" rx="1"/><rect x="541" y="442" width="5" height="12" rx="1"/>
</g>
<text class="tiny" x="562" y="452">T = 32 FMAs per element loaded &#183; intensity T/4 = 8 FLOP/byte</text>
</svg>
