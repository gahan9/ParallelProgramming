<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 492" width="1200" height="492" role="img" aria-labelledby="t d">
<title id="t">HBM traffic for unfused versus fused attention, drawn to scale</title>
<desc id="d">Two horizontal bars drawn to the same scale for one attention head at sequence length 4096, head dimension 128, in fp16. The unfused bar is 132 mebibytes long: a short cyan span of 4 mebibytes for Q, K, V and O, followed by four equal amber spans of 32 mebibytes each as the score matrix is written by the first matmul, read by the softmax, written back by the softmax and read by the second matmul. The four spans light up one after another because they happen in sequence. The fused bar is the 4 mebibyte cyan span alone, with the remaining 128 mebibytes drawn as an empty dashed outline: that traffic never happens, because the score tile is computed, consumed and discarded on chip. The ratio is one plus N over d, which is 9 times at sequence length 1024, 33 times at 4096 and 129 times at 16384, and the data type cancels out of it entirely.</desc>

<!--
  brief:
    id: attention-traffic
    module: A09
    track: A
    visual_job: proportion
    signature_device: none
    motion_teaches: true
    motion_claim: "the four crossings of the HBM boundary happen one after another, not at once"
    numbers: derived from A09 section 2 - naive 8Nd + 8N^2, fused 8Nd, at N=4096 d=128 fp16
    static_fallback: "all four spans are drawn and labelled; motion only says which is current"

  A09's README has the Mermaid version of this as two subgraphs, and it shows the
  STRUCTURE well. What it cannot show is that the intermediate is 32x larger than
  everything else in the problem, because every Mermaid box is the same size. That
  proportion is the argument for fusing, so it needs a scale drawing.

  SCALE IS TRUE. 900 px maps to 132 MiB, so 1 px is 0.1467 MiB. The QKVO span is 27 px
  because 4 MiB really is 27 px; each score-matrix crossing is 218 px because 32 MiB
  really is 218 px.

  The dashed empty outline on the fused bar is the lane-grid vocabulary from
  divergence.svg applied to bytes: dashed and unfilled means it does not happen at all.
-->

<style>
  .ground   { fill: #0F172A; }
  .rule     { fill: #0891B2; }
  .eyebrow  { fill: #0891B2; font: 700 12.5px Inter, "Segoe UI", system-ui, sans-serif; letter-spacing: 3.2px; }
  .head     { fill: #F8FAFC; font: 700 30px Inter, "Segoe UI", system-ui, sans-serif; letter-spacing: -.7px; }
  .sub      { fill: #94A3B8; font: 400 15px Inter, "Segoe UI", system-ui, sans-serif; }
  .secname  { fill: #64748B; font: 700 11px "JetBrains Mono", Consolas, ui-monospace, monospace; letter-spacing: 1.6px; }
  .barname  { font: 700 13.5px "JetBrains Mono", Consolas, ui-monospace, monospace; letter-spacing: .5px; }
  .barsub   { fill: #64748B; font: 400 11px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .val      { fill: #F8FAFC; font: 700 17px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .seg      { fill: #FBBF24; font: 700 11.5px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .ghost    { fill: none; stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
  .ghostl   { fill: #64748B; font: 400 12px Inter, "Segoe UI", system-ui, sans-serif; }
  .keep     { fill: #0891B2; }
  .tiny     { fill: #64748B; font: 400 11.5px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .lbl      { fill: #CBD5E1; font: 400 12.5px Inter, "Segoe UI", system-ui, sans-serif; }
  .verdict  { font: 700 15px Inter, "Segoe UI", system-ui, sans-serif; }
  .col      { fill: #64748B; font: 700 10.5px "JetBrains Mono", Consolas, ui-monospace, monospace; letter-spacing: 1px; }
  .num      { fill: #F8FAFC; font: 700 14px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .divide   { stroke: #1E293B; stroke-width: 1; }

  .cross { fill: #7C3A0B; }
  /* Four crossings of the HBM boundary, in order. A still bar cannot distinguish
     "four trips" from "one big trip", and four trips is the reason fusing works. */
  .x1 { animation: lit 4.4s steps(1, end) infinite; }
  .x2 { animation: lit 4.4s steps(1, end) infinite; animation-delay: 1.1s; }
  .x3 { animation: lit 4.4s steps(1, end) infinite; animation-delay: 2.2s; }
  .x4 { animation: lit 4.4s steps(1, end) infinite; animation-delay: 3.3s; }
  @keyframes lit { 0%, 24.9% { fill: #F59E0B } 25%, 100% { fill: #7C3A0B } }
  @media (prefers-reduced-motion: reduce) {
    .x1, .x2, .x3, .x4 { animation: none; fill: #92400E }
  }
</style>

<rect class="ground" width="1200" height="492"/>
<rect class="rule" width="1200" height="4"/>

<text class="eyebrow" x="56" y="52">MODULE A09 &#183; THE INTERMEDIATE IS BIGGER THAN THE PROBLEM</text>
<text class="head"    x="54" y="92">The matrix you never store is the one you never move</text>
<text class="sub"     x="56" y="120">One head, N = 4096, d = 128, fp16. The scores are 32&#215; the size of Q, K, V and O combined.</text>

<text class="secname" x="56" y="158">HBM TRAFFIC PER HEAD &#183; BARS DRAWN TO SCALE</text>

<!-- ================= unfused: 132 MiB = 900 px ================= -->
<text class="barname" x="56" y="188" fill="#F59E0B">UNFUSED</text>
<text class="barsub"  x="56" y="204">S lives in</text>
<text class="barsub"  x="56" y="218">HBM</text>
<rect class="keep"        x="200" y="176" width="27"  height="42"/>
<rect class="cross x1"    x="227" y="176" width="218" height="42"/>
<rect class="cross x2"    x="445" y="176" width="218" height="42"/>
<rect class="cross x3"    x="663" y="176" width="218" height="42"/>
<rect class="cross x4"    x="881" y="176" width="219" height="42"/>
<g stroke="#0F172A" stroke-width="1.5">
  <line x1="227" y1="176" x2="227" y2="218"/><line x1="445" y1="176" x2="445" y2="218"/>
  <line x1="663" y1="176" x2="663" y2="218"/><line x1="881" y1="176" x2="881" y2="218"/>
</g>
<g class="seg">
  <text x="242" y="202">write S</text><text x="460" y="202">read S</text>
  <text x="678" y="202">write P</text><text x="896" y="202">read P</text>
</g>
<g class="tiny" fill="#B45309">
  <text x="242" y="236">32 MiB</text><text x="460" y="236">32 MiB</text>
  <text x="678" y="236">32 MiB</text><text x="896" y="236">32 MiB</text>
</g>
<text class="val" x="200" y="260">132 MiB</text>

<!-- ================= fused: 4 MiB = 27 px, the rest never happens ================= -->
<text class="barname" x="56" y="306" fill="#10B981">FUSED</text>
<text class="barsub"  x="56" y="322">S never</text>
<text class="barsub"  x="56" y="336">materialized</text>
<rect class="keep"  x="200" y="294" width="27"  height="42"/>
<rect class="ghost" x="227" y="294" width="873" height="42"/>
<text class="ghostl" x="430" y="320">128 MiB that never crosses the HBM boundary at all</text>
<text class="val"   x="200" y="366">4 MiB</text>
<text class="tiny"  x="284" y="366">= Q, K, V, O only. The score tile is computed, consumed and discarded in registers and LDS.</text>

<line class="divide" x1="56" y1="386" x2="1144" y2="386"/>

<!-- ================= the closed form ================= -->
<text class="col" x="56"  y="410">RATIO = 1 + N/d</text>
<text class="col" x="256" y="410">N = 1,024</text>
<text class="col" x="392" y="410">N = 4,096</text>
<text class="col" x="528" y="410">N = 16,384</text>
<text class="num" x="256" y="432" fill="#10B981">9&#215;</text>
<text class="num" x="392" y="432" fill="#F59E0B">33&#215;</text>
<text class="num" x="528" y="432" fill="#ED1C24">129&#215;</text>
<text class="lbl" x="600" y="430">d is fixed by the architecture; N has grown from 512 to 128k. The gap only widens.</text>

<text class="tiny" x="56" y="456">The dtype cancels: fp8 halves both bars and changes nothing about whether to fuse. Unfused intensity saturates at d/2 = 64 FLOP/byte however long the context gets;</text>
<text class="tiny" x="56" y="474">fused intensity is N/2 and unbounded. Derived from A09 section 2. The fused result is exact, not an approximation (Dao et al. 2022).</text>
</svg>
