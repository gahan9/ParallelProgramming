<text class="modtag"  x="1060" y="522" fill="#DB2777">D02</text>

<line class="divide" x1="70" y1="544" x2="1144" y2="544"/>

<text class="note" x="70" y="568">An analogy that misleads is worse than none, so each module's Section 1 also says where its own stops being true &#8212; read that part.</text>
<text class="tiny" x="70" y="590">The break is where the engineering lives: lanes do not tire the way rowers do, two gradients cannot</text>
<text class="tiny" x="70" y="606">disagree the way two builders can, and a diner never slows the table down the way one more sequence does.</text>
</svg>
