<text class="world"   x="70"   y="318">A workbench inside the building</text>
<text class="machine" x="568"  y="318">shared memory / LDS</text>
<text class="modtag"  x="1060" y="318" fill="#0891B2">A02</text>

<text class="world"   x="70"   y="352">A rowing eight: one call, every oar</text>
<text class="machine" x="568"  y="352">warp of 32, wavefront of 64</text>
<text class="modtag"  x="1060" y="352" fill="#0891B2">A03</text>

