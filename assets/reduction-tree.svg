<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 492" width="1200" height="492" role="img" aria-labelledby="t d">
<title id="t">A reduction tree collapsing sixteen lanes over four rounds</title>
<desc id="d">Five rows of sixteen lanes. The top row has all sixteen lanes active. Each round below it halves the number of active lanes: eight, then four, then two, then one, while the lanes that have already contributed sit idle. The total number of additions is fifteen either way, but a sequential sum needs fifteen steps in a row where the tree needs four rounds. A panel on the right contrasts work against depth at sixteen values and at one million values, where the tree is about fifty-two thousand times shallower. Only fifteen of the sixty-four lane slots do useful work, which is the idle cost the module's algorithm cascade removes.</desc>

<!--
  brief:
    id: reduction-tree
    module: A04
    track: A
    visual_job: sequence
    signature_device: lane_grid
    motion_teaches: true
    motion_claim: "the rounds happen one after another, and each one darkens half the array"
    numbers: derived - W = n-1 additions, D = log2(n) rounds; see A04 section 2
    static_fallback: "every round is drawn; the cue bar only says which one is current"

  Mermaid already draws the reduction TREE in A04 section 3 and draws it well. What it
  cannot do is show the rounds happening in sequence, or show the lane array going dark
  as it collapses - and the darkening is the part that motivates stage 7. That is the
  only reason this file exists.

  Third meaning for the lane grid, consistent with divergence.svg: solid cyan is a lane
  doing work this round, dim slate is a lane that is present but idle.
-->

<style>
  .ground  { fill: #0F172A; }
  .rule    { fill: #0891B2; }
  .eyebrow { fill: #0891B2; font: 700 12.5px Inter, "Segoe UI", system-ui, sans-serif; letter-spacing: 3.2px; }
  .head    { fill: #F8FAFC; font: 700 30px Inter, "Segoe UI", system-ui, sans-serif; letter-spacing: -.7px; }
  .sub     { fill: #94A3B8; font: 400 15px Inter, "Segoe UI", system-ui, sans-serif; }
  .panel   { fill: none; stroke: #1E293B; stroke-width: 1; }
  .phead   { font: 700 13.5px "JetBrains Mono", Consolas, ui-monospace, monospace; letter-spacing: .5px; }
  .step    { fill: #CBD5E1; font: 700 11.5px "JetBrains Mono", Consolas, ui-monospace, monospace; letter-spacing: .6px; }
  .sfac    { fill: #64748B; font: 400 11px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .live    { fill: #0891B2; font: 700 11px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .tiny    { fill: #64748B; font: 400 11.5px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .lbl     { fill: #CBD5E1; font: 400 12.5px Inter, "Segoe UI", system-ui, sans-serif; }
  .num     { fill: #F8FAFC; font: 700 13px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .col     { fill: #64748B; font: 700 10.5px "JetBrains Mono", Consolas, ui-monospace, monospace; letter-spacing: 1px; }
  .win     { fill: #10B981; font: 700 13px "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .verdict { font: 700 15px Inter, "Segoe UI", system-ui, sans-serif; }

  .on  { fill: #0891B2; }
  .off { fill: #172033; stroke: #223049; stroke-width: 1; }

  /* Four rounds, one after another. The sequence IS the lesson: a still ladder
     cannot say "these happen in turn", which is the misconception A04 fixes. */
  .c1 { animation: cue 5.6s steps(1, end) infinite; }
  .c2 { animation: cue 5.6s steps(1, end) infinite; animation-delay: 1.4s; }
  .c3 { animation: cue 5.6s steps(1, end) infinite; animation-delay: 2.8s; }
  .c4 { animation: cue 5.6s steps(1, end) infinite; animation-delay: 4.2s; }
  @keyframes cue { 0%, 24.9% { opacity: 1 } 25%, 100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) {
    .c1, .c2, .c3, .c4 { animation: none; opacity: .55 }
  }
</style>

<rect class="ground" width="1200" height="492"/>
<rect class="rule" width="1200" height="4"/>

<text class="eyebrow" x="56" y="52">MODULE A04 &#183; FIFTEEN ADDITIONS EITHER WAY</text>
<text class="head"    x="54" y="92">Depth, not work, is what the tree buys</text>
<text class="sub"     x="56" y="120">Sixteen values. A sequential sum waits fifteen times; the tree waits four.</text>

<defs><rect id="L" width="20" height="20" rx="2"/></defs>

