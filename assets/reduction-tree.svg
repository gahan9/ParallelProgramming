<!-- ================= RIGHT: work versus depth ================= -->
<rect class="panel" x="740" y="148" width="404" height="258" rx="4"/>
<text class="phead" x="760" y="176" fill="#10B981">SAME WORK &#183; DIFFERENT DEPTH</text>

<text class="col" x="760"  y="206">n</text>
<text class="col" x="852"  y="206">ADDITIONS</text>
<text class="col" x="978"  y="206">SEQ DEEP</text>
<text class="col" x="1080" y="206">TREE</text>
<line x1="760" y1="214" x2="1124" y2="214" stroke="#1E293B" stroke-width="1"/>

<text class="num" x="760"  y="238">16</text>
<text class="num" x="852"  y="238">15</text>
<text class="num" x="978"  y="238">15</text>
<text class="win" x="1080" y="238">4</text>

<text class="num" x="760"  y="266">1,048,576</text>
<text class="num" x="852"  y="266">1,048,575</text>
<text class="num" x="978"  y="266">1,048,575</text>
<text class="win" x="1080" y="266">20</text>

<text class="lbl" x="760" y="300">Work is identical. Only the waiting collapses,</text>
<text class="lbl" x="760" y="318">from n-1 rounds down to log2(n) &#8212; about</text>
<text class="verdict" x="760" y="342" fill="#10B981">52,000&#215; shallower at one million values</text>

<text class="tiny" x="760" y="372">The tree is why a reduction is not O(n) time.</text>
<text class="tiny" x="760" y="390">Brent's theorem in A04 section 2 is the proof.</text>

<!-- the honest cost, stated on the graphic -->
<text class="verdict" x="56" y="434" fill="#F59E0B">The collapse wastes the array: 15 useful lane-steps out of 64 lane-slots, so 77% of the array idles.</text>
<text class="tiny"    x="56" y="456">Counts are exact for stage 3 sequential addressing. Work and depth are derived, not measured.</text>
<text class="tiny"    x="56" y="474">Giving each thread many elements before the tree starts &#8212; A04 stage 7, the algorithm cascade &#8212; is what recovers the idle fraction.</text>
</svg>
